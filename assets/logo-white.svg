<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 52" fill="none" role="img" aria-label="DigiLeaf">
  <!-- Double Leaf Emblem -->
  <g transform="translate(2, 6)">
    <!-- Main curved leaf -->
    <path d="M28 2C14 4 4 16 3 32C18 33 32 23 34 8C34 5.5 32 3 28 2Z" fill="#22C55E"/>
    <!-- Overlapping bright lime leaf -->
    <path d="M22 14C11 18 6 27 5 36C17 36 28 29 29 18C29 16 26.5 14.5 22 14Z" fill="#4ADE80" opacity="0.9"/>
    <!-- Subtle leaf vein highlight -->
    <path d="M6 35C14 26 21 16 27 6" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Wordmark -->
  <text x="44" y="32" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.03em">Digi<tspan fill="#4ADE80">Leaf</tspan></text>
  <!-- Tagline -->
  <text x="45" y="44" fill="#99F6E4" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="0.16em">BUILD. BRAND. GROW.</text>
</svg>
